<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KANCHA — Antes de que pase.</title>
  <script>
    // Forward Supabase auth hashes to login.html (email confirm, magic link).
    // Supabase appends #access_token=... to the configured redirect URL (this page).
    // We pass the hash to login.html so the Supabase client there can process it.
    (function () {
      var h = window.location.hash;
      if (h && h.includes('access_token')) {
        window.location.replace('/login.html' + h);
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="landing.css" />
  <style>
    /* landing scrolls naturally — override the app's locked-viewport rules */
    html { height: auto !important; overflow: visible !important; }
    body { height: auto !important; min-height: 100vh; overflow-x: hidden !important; overflow-y: auto !important; background: #181b18 !important; display: block !important; }
    #root { height: auto !important; min-height: 0 !important; overflow: visible !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Prevent pitchscore.js from mounting <App/> — landing renders its own root -->
  <script>window.__SKIP_APP_RENDER = true;</script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="pitchscore.js"></script>
  <script type="text/babel" src="landing.jsx"></script>
</body>
</html>
