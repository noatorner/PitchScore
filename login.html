<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — KANCHA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Saira', sans-serif;
      background: #181b18;
      color: #f0e7d0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* background texture */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(74,112,64,0.14), transparent 55%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.010) 0 48px, rgba(0,0,0,0.04) 48px 96px);
      pointer-events: none;
    }

    .kn-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: #1d201d;
      border: 1px solid #2c302c;
      border-radius: 12px;
      padding: 40px 36px 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }

    /* logo */
    .kn-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .kn-logo-wrap svg {
      width: 180px;
      height: auto;
      display: block;
    }
    .kn-logo-wrap svg path,
    .kn-logo-wrap svg polygon { fill: #f0e7d0; }
    .kn-logo-wrap svg circle  { fill: #c8442e; }
    .kn-claim {
      font-style: italic;
      font-weight: 400;
      font-size: 13px;
      color: #8a8067;
      letter-spacing: 0.01em;
    }
    .kn-claim span { color: #c8442e; font-style: normal; }

    /* tabs */
    .kn-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #141714;
      border-radius: 7px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 26px;
    }
    .kn-tab {
      padding: 10px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: #6f7567;
      font-family: 'Saira', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .kn-tab.is-active {
      background: #2c302c;
      color: #f0e7d0;
    }

    /* form */
    .kn-form { display: flex; flex-direction: column; gap: 14px; }
    .kn-field { display: flex; flex-direction: column; gap: 6px; }
    .kn-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8a8067;
    }
    .kn-input {
      background: #141714;
      border: 1px solid #2c302c;
      border-radius: 6px;
      padding: 13px 14px;
      font-family: 'Saira', sans-serif;
      font-size: 14px;
      color: #f0e7d0;
      transition: border-color .15s;
      outline: none;
      width: 100%;
    }
    .kn-input::placeholder { color: #4a4f44; }
    .kn-input:focus { border-color: #4a6b3a; }

    .kn-btn-submit {
      margin-top: 6px;
      padding: 15px;
      background: #c8442e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Saira', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .kn-btn-submit:hover { background: #b03826; transform: translateY(-1px); }
    .kn-btn-submit:disabled { background: #3a3f39; color: #6f7567; cursor: not-allowed; transform: none; }

    /* messages */
    .kn-msg {
      padding: 11px 14px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
    }
    .kn-msg.is-error   { background: rgba(200,68,46,0.14); border: 1px solid rgba(200,68,46,0.3); color: #f09080; display: block; }
    .kn-msg.is-success { background: rgba(61,107,50,0.16); border: 1px solid rgba(61,107,50,0.35); color: #84c168; display: block; }

    /* divider */
    .kn-divider {
      height: 1px;
      background: #2c302c;
      margin: 6px 0;
    }

    .kn-back {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #6f7567;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color .14s;
    }
    .kn-back:hover { color: #cabf9f; }

    /* loading spinner */
    @keyframes kn-spin { to { transform: rotate(360deg); } }
    .kn-spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: kn-spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="kn-card">
    <!-- KANCHA logo -->
    <div class="kn-logo-wrap">
      <svg viewBox="0 0 156.63 18.31" role="img" aria-label="KANCHA">
        <polygon points="18.72 1.03 14.31 1.03 7.08 8.03 3.35 8.03 3.35 1.03 0 1.03 0 18.31 3.35 18.31 3.35 10.97 7.08 10.97 15.29 18.31 19.8 18.31 10 9.49 18.72 1.03"></polygon>
        <polygon points="72.34 13.66 58.32 .67 55.44 .67 55.44 18.31 58.77 18.31 58.77 5.33 72.8 18.31 75.67 18.31 75.67 .67 72.34 .67 72.34 13.66"></polygon>
        <path d="M96.42,10.66c-.37,2.74-3.74,4.72-8.02,4.72-4.92,0-8.1-2.44-8.1-6.21s3.18-6.23,8.1-6.23c4.13,0,7.47,1.95,7.94,4.64l.11.62h3.36l-.11-.85c-.57-4.33-5.22-7.35-11.31-7.35-7,0-11.52,3.6-11.52,9.17s4.41,9.14,11.52,9.14c6.27,0,10.96-3.08,11.4-7.48l.08-.82h-3.36l-.09.65Z"></path>
        <polygon points="117.65 7.83 104.36 7.83 104.36 .67 100.97 .67 100.97 18.31 104.36 18.31 104.36 10.81 117.65 10.81 117.65 18.31 121.06 18.31 121.06 .67 117.65 .67 117.65 7.83"></polygon>
        <path d="M20,18.31h4.24l5.17-5.17c2.29,1.82,5.16,2.82,8.11,2.82s5.81-1,8.11-2.82l5.17,5.17h4.24L37.52.79l-17.52,17.52ZM31.55,11l5.97-5.97,5.97,5.97c-1.73,1.29-3.78,1.96-5.97,1.96s-4.24-.68-5.97-1.96Z"></path>
        <path d="M139.11.79l-17.52,17.52h4.24l5.17-5.17c2.29,1.82,5.16,2.82,8.11,2.82s5.81-1,8.11-2.82l5.17,5.17h4.24L139.11.79ZM139.11,12.96c-2.18,0-4.24-.68-5.97-1.96l5.97-5.97,5.97,5.97c-1.73,1.29-3.78,1.96-5.97,1.96Z"></path>
        <circle cx="88.33" cy="9.16" r="1.48"></circle>
      </svg>
      <span class="kn-claim">Antes de que pase<span>.</span></span>
    </div>

    <!-- mode tabs -->
    <div class="kn-tabs">
      <button class="kn-tab is-active" id="tab-login"  onclick="setMode('login')">Entrar</button>
      <button class="kn-tab"           id="tab-signup" onclick="setMode('signup')">Crear cuenta</button>
    </div>

    <!-- feedback message -->
    <div class="kn-msg" id="kn-msg"></div>

    <!-- form -->
    <form class="kn-form" id="kn-form" onsubmit="handleSubmit(event)">
      <div class="kn-field">
        <label class="kn-label" for="email">Email</label>
        <input class="kn-input" type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email" />
      </div>
      <div class="kn-field">
        <label class="kn-label" for="password">Contraseña</label>
        <input class="kn-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" minlength="6" />
      </div>
      <div class="kn-divider"></div>
      <button class="kn-btn-submit" type="submit" id="kn-submit">ENTRAR</button>
    </form>

    <a class="kn-back" href="/">← Volver a la landing</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL      = "https://hmjyfdcbmqtoddnprtlq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtanlmZGNibXF0b2RkbnBydGxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODQ3MjQsImV4cCI6MjA5NjU2MDcyNH0.ZkdAX_lDk1t89mbEUWIznRuiAbVQagp--1pXas2yrso";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let mode = "login";

    // Redirect to app if already authenticated
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.replace("/jugar");
    });

    function setMode(m) {
      mode = m;
      document.getElementById("tab-login").classList.toggle("is-active",  m === "login");
      document.getElementById("tab-signup").classList.toggle("is-active", m === "signup");
      document.getElementById("kn-submit").textContent = m === "login" ? "ENTRAR" : "CREAR CUENTA";
      document.getElementById("password").autocomplete = m === "login" ? "current-password" : "new-password";
      showMsg("", "");
    }

    function showMsg(text, type) {
      const el = document.getElementById("kn-msg");
      el.textContent = text;
      el.className = "kn-msg" + (type ? " is-" + type : "");
    }

    function setLoading(on) {
      const btn = document.getElementById("kn-submit");
      btn.disabled = on;
      btn.innerHTML = on
        ? '<span class="kn-spinner"></span>' + (mode === "login" ? "ENTRANDO…" : "CREANDO CUENTA…")
        : (mode === "login" ? "ENTRAR" : "CREAR CUENTA");
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      showMsg("", "");
      setLoading(true);

      try {
        let error;
        if (mode === "login") {
          ({ error } = await sb.auth.signInWithPassword({ email, password }));
        } else {
          ({ error } = await sb.auth.signUp({ email, password }));
        }

        if (error) {
          showMsg(translateError(error.message), "error");
        } else if (mode === "signup") {
          showMsg("¡Cuenta creada! Revisa tu email para confirmar y luego entra.", "success");
        } else {
          window.location.replace("/jugar");
          return;
        }
      } catch (err) {
        showMsg("Error inesperado. Inténtalo de nuevo.", "error");
      } finally {
        setLoading(false);
      }
    }

    function translateError(msg) {
      if (msg.includes("Invalid login"))       return "Email o contraseña incorrectos.";
      if (msg.includes("Email not confirmed")) return "Confirma tu email antes de entrar.";
      if (msg.includes("already registered"))  return "Este email ya está registrado. Prueba a entrar.";
      if (msg.includes("Password should"))     return "La contraseña debe tener al menos 6 caracteres.";
      return msg;
    }
  </script>
</body>
</html>
